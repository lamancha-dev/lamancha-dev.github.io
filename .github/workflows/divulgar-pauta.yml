name: Divulgar PAUTA automaticamente

on:
  schedule:
    # Segunda, quarta e sexta às 10:00 (hora de Lisboa no inverno)
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch: {} # permite correr manualmente no GitHub, se quiseres testar

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r divulgacao-pauta/requirements.txt

      - name: Publicar no Facebook e no Instagram
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python divulgacao-pauta/publicar.py

      - name: Guardar o progresso (próximo post a publicar)
        run: |
          git config user.name "pauta-bot"
          git config user.email "pauta-bot@users.noreply.github.com"
          git add divulgacao-pauta/estado.json
          git diff --cached --quiet || git commit -m "Atualiza estado da divulgação automática"
          git push
