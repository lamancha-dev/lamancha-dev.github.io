<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f5e9"/>
      <stop offset="1" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg2)"/>

  <!-- desk, tidy -->
  <rect x="60" y="760" width="960" height="40" fill="#8d6e63"/>
  <rect x="60" y="800" width="960" height="220" fill="#6d4c41"/>

  <!-- laptop open, calm glow -->
  <rect x="330" y="700" width="220" height="140" rx="10" fill="#37474f"/>
  <rect x="345" y="712" width="190" height="104" rx="4" fill="#90caf9"/>
  <text x="370" y="760" font-family="Helvetica, Arial" font-size="26" font-weight="bold" fill="#0d47a1">PAUTA</text>
  <text x="365" y="790" font-family="Helvetica, Arial" font-size="15" fill="#1565c0">médias prontas ✓</text>
  <rect x="325" y="840" width="230" height="16" rx="6" fill="#263238"/>

  <!-- coffee cup, steaming, upright -->
  <rect x="700" y="760" width="56" height="40" rx="8" fill="#fff" stroke="#bbb"/>
  <path d="M756 770 q20 5 10 20 q-10 10 -22 6" fill="none" stroke="#bbb" stroke-width="5"/>
  <path d="M718 748 q-6 -14 4 -24" stroke="#b0bec5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M738 748 q-6 -14 4 -24" stroke="#b0bec5" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- teacher: relaxed, leaning back, arms behind head -->
  <g>
    <rect x="490" y="620" width="150" height="20" rx="10" fill="#5d4037"/>
    <!-- body / cardigan, upright -->
    <path d="M495 800 Q500 690 565 690 Q630 690 635 800 Z" fill="#43a047"/>
    <!-- arms behind head -->
    <path d="M505 700 Q470 650 520 625" stroke="#f3c6a0" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M625 700 Q660 650 610 625" stroke="#f3c6a0" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="565" cy="650" r="50" fill="#f3c6a0"/>
    <!-- neat hair -->
    <path d="M515 630 Q520 590 565 592 Q610 590 615 630 Q605 605 565 608 Q525 605 515 630 Z" fill="#4a3429"/>
    <!-- smiling closed eyes -->
    <path d="M540 650 q8 -8 16 0" stroke="#4a3429" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M580 650 q8 -8 16 0" stroke="#4a3429" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- rosy cheeks -->
    <circle cx="540" cy="662" r="8" fill="#ef9a9a" opacity="0.6"/>
    <circle cx="592" cy="662" r="8" fill="#ef9a9a" opacity="0.6"/>
    <!-- big smile -->
    <path d="M543 668 Q565 688 589 668" stroke="#7a4a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- stars of relief -->
  <text x="430" y="560" font-size="40">✨</text>
  <text x="690" y="580" font-size="34">✨</text>

  <!-- speech bubble -->
  <g>
    <path d="M700 420 h300 a24 24 0 0 1 24 24 v110 a24 24 0 0 1 -24 24 h-170 l-40 44 l6 -44 h-90 a24 24 0 0 1 -24 -24 v-110 a24 24 0 0 1 24 -24 z" fill="#ffffff" stroke="#263238" stroke-width="4"/>
    <text x="725" y="475" font-family="Helvetica, Arial" font-size="32" font-weight="bold" fill="#263238">A pauta já</text>
    <text x="725" y="515" font-family="Helvetica, Arial" font-size="32" font-weight="bold" fill="#263238">está fechada!</text>
    <text x="725" y="548" font-family="Helvetica, Arial" font-size="20" fill="#2e7d32">Obrigada, PAUTA 💚</text>
  </g>
</svg>
