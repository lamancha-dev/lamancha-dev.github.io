<style>
:root{
  --paper:#f4f5f3;
  --card:#ffffff;
  --ink:#2b2420;
  --soft:#7a6c60;
  --hair:#e4e6e2;

  --azul:#1d6276;  --azul-bg:#e1eef1;
  --coral:#8f2a3c; --coral-bg:#f4e4e6;
  --sol:#c18a12;   --sol-bg:#faf0d6;
  --menta:#1d6276; --menta-bg:#e1eef1;

  --sh:0 1px 2px rgba(70,45,25,.05),0 6px 20px rgba(70,45,25,.07);
  --sh-hover:0 2px 4px rgba(70,45,25,.06),0 14px 34px rgba(70,45,25,.12);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --text:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:var(--display);background:var(--paper);color:var(--ink);line-height:1.55;}
button{font-family:inherit;}

/* HEADER */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);}
.topbar-in{display:flex;align-items:center;gap:16px;padding:12px 28px;max-width:1500px;margin:0 auto;}
.logo{width:54px;height:54px;background:#fff;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:var(--sh);cursor:pointer;}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px;}
.wordmark{cursor:pointer;line-height:1.1;}
.wordmark b{display:block;font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--azul);}
.wordmark b span{background:none;padding:0;}
.wordmark small{font-size:12px;color:var(--soft);font-weight:600;}
.topstats{margin-left:auto;display:flex;gap:8px;align-items:center;}
.chip{border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;background:var(--azul-bg);color:var(--azul);white-space:nowrap;}
.chip.c2{background:var(--coral-bg);color:#8f2a3c;} .chip.c3{background:var(--sol-bg);color:#8a6420;}
.ring{width:46px;height:46px;flex-shrink:0;}
.menu-btn{display:none;border:none;background:var(--azul);color:#fff;border-radius:8px;width:44px;height:44px;font-size:20px;cursor:pointer;}

/* LAYOUT */
.layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto;}
.sidebar{width:300px;flex-shrink:0;padding:22px 18px 40px;position:sticky;top:79px;height:calc(100vh - 79px);overflow-y:auto;}
.main{flex:1;min-width:0;padding:30px 40px 60px;}

/* SIDEBAR */
.navhome{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:18px;border-radius:8px;background:#fff;font-weight:700;cursor:pointer;box-shadow:var(--sh);transition:all .15s;color:var(--ink);}
.navhome:hover{box-shadow:var(--sh-hover);}
.navhome.active{background:var(--azul);color:#fff;}
.navhome svg{width:18px;height:18px;}
.navgroup{margin-bottom:18px;}
.navgroup-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;font-weight:700;font-size:14px;margin-bottom:6px;}
.navgroup-head svg{width:19px;height:19px;}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 0 1px 6px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;color:#4a3f37;transition:background .12s;}
.navitem:hover{background:#fff;}
.navitem .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.navitem .pct{margin-left:auto;font-size:11px;font-weight:700;color:var(--soft);}
.navitem.active{background:#fff;box-shadow:var(--sh);font-weight:700;color:var(--ink);}

/* HOME */
.hello{display:grid;grid-template-columns:1fr 290px;gap:30px;margin-bottom:30px;align-items:center;}
.hello-main{position:relative;overflow:hidden;padding:18px 4px 8px;display:flex;flex-direction:column;justify-content:center;min-height:250px;}
.hello-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--azul);margin-bottom:14px;position:relative;z-index:1;}
.hello-eyebrow::before{content:"";width:26px;height:2px;background:var(--sol);}
.hello-main h1{position:relative;z-index:1;margin:0;font-family:var(--text);font-size:50px;line-height:1.02;letter-spacing:-.025em;font-weight:600;color:var(--ink);max-width:620px;}
.hello-main h1 em{font-style:italic;color:var(--coral);}
.hello-main .hello-sub{position:relative;z-index:1;font-size:18px;font-weight:600;color:var(--soft);margin:14px 0 0;max-width:560px;}
.hello-main .hello-sub b{color:var(--ink);}
.hello-btns{position:relative;z-index:1;display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}
.btn.btn-solid{background:var(--azul);color:#fff;padding:13px 22px;font-size:15px;}
.btn.btn-solid:hover{background:#174f60;}
.hello-deco{position:absolute;right:-10px;top:50%;transform:translateY(-50%) rotate(-8deg);font-family:var(--text);font-size:260px;line-height:1;font-style:italic;font-weight:600;color:var(--azul);opacity:.06;pointer-events:none;letter-spacing:-.05em;}
.joke{background:linear-gradient(160deg,#fff 45%,#fbf4e3 100%);border-radius:12px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;border-top:4px solid var(--sol);}
.joke .tag{align-self:flex-start;background:var(--sol-bg);color:#8a6420;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
.joke p{margin:0;font-family:var(--text);font-size:16px;line-height:1.5;flex:1;font-style:italic;}
.joke button{align-self:flex-end;margin-top:12px;border:none;background:var(--sol-bg);color:#8a6420;border-radius:999px;padding:6px 14px;font-weight:700;font-size:12px;cursor:pointer;}
.joke button:hover{background:var(--sol);color:#fff;}

.btn{display:inline-flex;align-items:center;gap:8px;border:none;background:#fff;color:var(--azul);border-radius:8px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-hover);}

.section-title{display:flex;align-items:center;gap:12px;margin:34px 0 16px;}
.section-title .sicon{width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.section-title .sicon svg{width:22px;height:22px;}
.section-title h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;}
.section-title .n{font-size:13px;color:var(--soft);font-weight:600;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
.card{background:linear-gradient(155deg,#fff 45%,color-mix(in srgb,var(--g) 7%,#fff) 100%);border-radius:10px;box-shadow:var(--sh);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-hover);}
.card-top{padding:18px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:92px;}
.card-top h3{margin:0;font-size:17px;line-height:1.25;font-weight:700;}
.card-top svg{width:24px;height:24px;flex-shrink:0;opacity:.7;}
.card-bot{padding:12px 20px 18px;display:flex;flex-direction:column;gap:9px;}
.card-meta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--soft);}
.bar{height:8px;border-radius:999px;background:#e8eae6;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--g,var(--azul));border-radius:999px;transition:width .4s;}
.trophy{font-size:12px;font-weight:700;color:var(--azul);}

/* TOPIC */
.banner{border-radius:12px;padding:26px 30px;box-shadow:var(--sh-hover);position:relative;overflow:hidden;margin-bottom:22px;}
.banner .crumb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.85;}
.banner .crumb a{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.banner h1{margin:6px 0 0;font-size:31px;line-height:1.1;letter-spacing:-.025em;font-weight:800;max-width:640px;}
.banner .big{position:absolute;right:22px;top:50%;transform:translateY(-50%) rotate(-8deg);width:110px;height:110px;opacity:.16;}
.banner .big svg{width:100%;height:100%;}

.tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;align-items:center;}
.tabbtn{display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14.5px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:all .12s;}
.tabbtn svg{width:17px;height:17px;}
.tabbtn:hover{box-shadow:var(--sh-hover);}
.tabbtn.on{background:var(--g);color:var(--g-on);}
.tabbtn .cnt{background:rgba(0,0,0,.08);border-radius:999px;font-size:11.5px;padding:1px 8px;}
.tabbtn.on .cnt{background:rgba(255,255,255,.25);}
.tabs .prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;min-width:220px;color:var(--soft);}
.tabs .prog .bar{flex:1;}

.theory{background:linear-gradient(170deg,#fff 60%,color-mix(in srgb,var(--g) 5%,#fff) 100%);border-radius:12px;padding:32px 36px;box-shadow:var(--sh);font-family:var(--text);font-size:16px;}
.theory h3{font-family:var(--display);font-size:19px;font-weight:800;margin:28px 0 12px;color:var(--g);}
.theory h3:first-child{margin-top:0;}
.theory h4{font-family:var(--display);font-size:16px;font-weight:700;margin:18px 0 6px;}
.theory p{margin:8px 0;}
.theory b{font-weight:600;color:var(--g);}
.theory .ex{font-style:italic;color:#6b5d52;}
.theory table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:14.5px;border-radius:8px;overflow:hidden;border:1px solid var(--hair);}
.theory th{background:var(--g-bg);color:var(--g);font-family:var(--display);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:11px 14px;}
.theory td{padding:10px 14px;vertical-align:top;border-top:1px solid var(--hair);}
.theory td:first-child{font-family:var(--display);font-weight:600;}
.theory ul{padding-left:22px;margin:8px 0;}
.theory li{margin:6px 0;}
.theory .def{border-radius:8px;padding:13px 17px;margin:12px 0;background:var(--g-bg);border-left:4px solid var(--g);}
.theory .def b{font-family:var(--display);font-weight:700;}
.theory .destaque{background:var(--sol-bg);border-radius:8px;padding:13px 17px;margin:16px 0;}
.theory .destaque::before{content:"Atenção · ";font-family:var(--display);font-weight:800;color:#8a6420;}
.tocta{margin-top:24px;display:flex;justify-content:flex-end;}
.wm{position:absolute;pointer-events:none;font-family:var(--text);font-style:italic;font-weight:600;line-height:.8;color:#5d6460;opacity:.05;transform:rotate(-12deg);transform-origin:center;letter-spacing:-.04em;white-space:nowrap;user-select:none;}
.has-wm{position:relative;overflow:hidden;}
.has-wm > *:not(.wm){position:relative;z-index:1;}
.card .wm{right:-2px;bottom:4px;font-size:118px;opacity:.06;}
.joke .wm{left:-6px;bottom:-30px;font-size:170px;opacity:.06;transform:rotate(10deg);}
.theory .wm{right:-14px;top:-20px;font-size:230px;opacity:.035;}
.eli5 .wm{right:4px;bottom:-44px;font-size:190px;opacity:.05;transform:rotate(14deg);}
.ex-card .wm{right:-2px;top:-18px;font-size:120px;opacity:.035;}
.trick .wm{right:8px;bottom:-14px;font-size:80px;opacity:.06;}
.eli5{background:linear-gradient(120deg,#fff 40%,color-mix(in srgb,var(--g) 8%,#fff) 100%);border-left:6px solid var(--g);border-radius:12px;padding:24px 28px;margin-bottom:26px;position:relative;box-shadow:var(--sh);}
.eli5-tag{display:inline-block;background:var(--g);color:#fff;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:5px 12px;border-radius:999px;margin-bottom:12px;}
.eli5 p{margin:0;font-family:var(--text);font-size:19px;line-height:1.55;}
.eli5 b{color:var(--g);}
.tricks-title{font-size:21px;font-weight:800;margin:0 0 14px;letter-spacing:-.01em;}
.tricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
.trick{background:linear-gradient(160deg,#fff 50%,color-mix(in srgb,var(--g) 6%,#fff) 100%);border-radius:10px;padding:18px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;}
.trick-h{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--g);}
.trick-h .emo{width:38px;height:38px;border-radius:8px;background:var(--g-bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.trick p{margin:0;font-family:var(--text);font-size:15px;line-height:1.5;}
.trick b{color:var(--g);}
.trick-ex{margin-top:auto;background:var(--paper);border-radius:8px;padding:10px 12px;font-family:var(--text);font-style:italic;font-size:14px;color:#4a3f37;}
.trick-ex u,.trick u{text-decoration:none;border-bottom:2px solid var(--g);font-style:normal;font-weight:600;}

.ex-card{background:linear-gradient(160deg,#fff 55%,color-mix(in srgb,var(--g) 5%,#fff) 100%);border-radius:10px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--sh);}
.ex-q{display:flex;gap:12px;font-family:var(--text);font-size:16.5px;font-weight:600;margin-bottom:14px;}
.num{width:30px;height:30px;flex-shrink:0;border-radius:10px;background:var(--g-bg);color:var(--g);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:14px;}
.ex-q u{text-decoration:none;border-bottom:2px solid var(--sol);}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--hair);background:#fff;border-radius:8px;padding:11px 13px;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .12s;}
.opt .l{width:26px;height:26px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--paper);color:var(--soft);}
.opt:hover:not(:disabled){border-color:var(--g);background:var(--g-bg);}
.opt:disabled{cursor:default;color:var(--ink);}
.opt.ok{background:#e8f4ec;border-color:#3f8f5c;color:#245c38;font-weight:700;}
.opt.ok .l{background:#3f8f5c;color:#fff;}
.opt.bad{background:#fbeeec;border-color:#b5483f;color:#8f2f28;}
.opt.bad .l{background:#b5483f;color:#fff;}
.opt.bad.fresh{animation:shake .35s;}
.opt.dim{opacity:.5;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-row{display:flex;gap:10px;}
.answer-row input{flex:1;border:1.5px solid var(--hair);border-radius:8px;padding:11px 14px;font-size:15px;font-family:var(--text);background:var(--paper);}
.answer-row input:focus{outline:none;border-color:var(--g);background:#fff;}
.answer-row .btn{background:var(--g);color:var(--g-on);}
.fb{margin-top:14px;border-radius:8px;padding:13px 17px;font-size:14.5px;}
.fb.fresh{animation:pop .25s;}
.fb.ok{background:#e8f4ec;} .fb.ok .v{color:#245c38;}
.fb.bad{background:#fbeeec;} .fb.bad .v{color:#8f2f28;}
.fb .v{font-weight:700;display:block;margin-bottom:4px;}
.fb .c{font-family:var(--text);}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ex-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:12px;}
.ex-foot .score{font-weight:700;}
.finish{background:linear-gradient(135deg,#1d6276,#123f4d);color:#fff;border-radius:10px;padding:18px 22px;box-shadow:var(--sh);margin-bottom:18px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:12px;}
.finish span{font-size:26px;}
footer{margin-top:50px;font-size:12px;color:var(--soft);}


.navtools{display:flex;flex-direction:column;gap:4px;margin:-8px 0 18px;}
.navtool{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:#3b3530;transition:background .12s;}
.navtool:hover{background:#fff;}
.navtool.active{background:#fff;box-shadow:var(--sh);font-weight:700;}
.navtool .badge{margin-left:auto;background:#8f2a3c;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px;}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:-10px 0 26px;}
.act{display:flex;align-items:center;gap:16px;background:linear-gradient(150deg,#fff 50%,#eef4f5 100%);border-radius:12px;padding:18px 22px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;}
.act:hover{transform:translateY(-3px);box-shadow:var(--sh-hover);}
.act-ico{width:52px;height:52px;flex-shrink:0;border-radius:12px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;}
.act-ico svg{width:26px;height:26px;}
.act-ico-2{background:var(--coral);}
.navtool svg{width:18px;height:18px;flex-shrink:0;}
.ttl-ico{display:flex;align-items:center;gap:12px;}
.ttl-ico svg{width:34px;height:34px;}
.btn svg{width:17px;height:17px;}
.act h3{margin:0 0 2px;font-size:17px;font-weight:800;color:var(--azul);}
.act p{margin:0;font-size:13.5px;color:var(--soft);}
.act p b{color:#8f2a3c;}
.act-go{margin-left:auto;font-weight:800;font-size:13px;color:var(--azul);white-space:nowrap;}
.act .wm{right:-4px;bottom:-26px;font-size:110px;}
.daily{margin-bottom:10px;}
.daily-h{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.daily-tag{background:var(--sol);color:#fff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:6px 13px;border-radius:999px;}
.daily-date{font-size:13.5px;font-weight:600;color:var(--soft);}
.daily-note{margin:-4px 0 0;font-size:13px;color:var(--soft);font-weight:600;text-align:right;}
.ex-from{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.ex-from .dot{width:8px;height:8px;border-radius:50%;}
.ex-from a{cursor:pointer;color:var(--g);text-transform:none;letter-spacing:0;font-size:13px;}
.ex-from a:hover{text-decoration:underline;}
.banner-neutral{background:linear-gradient(135deg,#1d6276,#123f4d);color:#fff;}
.banner-p{margin:8px 0 0;font-size:15px;opacity:.88;max-width:620px;}
.result{display:flex;align-items:center;gap:22px;background:#fff;border-radius:12px;padding:20px 26px;box-shadow:var(--sh-hover);margin-bottom:18px;border-left:6px solid var(--sol);}
.nota{display:flex;align-items:baseline;gap:2px;font-family:var(--display);}
.nota b{font-size:58px;font-weight:800;line-height:1;color:#1d6276;}
.nota span{font-size:20px;font-weight:700;color:var(--soft);}
.result-t{font-weight:800;font-size:18px;}
.result p{margin:4px 0 0;color:var(--soft);}
.empty{display:flex;gap:18px;align-items:flex-start;background:#fff;border-radius:12px;padding:24px 26px;box-shadow:var(--sh);}
.empty > span{font-size:40px;}
.empty b{font-size:18px;}
.empty p{margin:6px 0 14px;color:var(--soft);}
@media (max-width:900px){ .acts{grid-template-columns:1fr;margin-top:0;} .act-go{display:none;} .result{flex-direction:column;align-items:flex-start;gap:8px;} }
/* Tablets / small laptops */
@media (max-width:1200px) and (min-width:901px){
  .sidebar{width:250px;}
  .main{padding:26px 28px 60px;}
  .hello{grid-template-columns:1fr;}
}
/* Big screens and interactive whiteboards: scale everything up */
@media (min-width:1700px){ body{zoom:1.12;} }
@media (min-width:2200px){ body{zoom:1.35;} }
@media (min-width:2900px){ body{zoom:1.7;} }
@media (min-width:3600px){ body{zoom:2.1;} }

@media (max-width:900px){
  .menu-btn{display:block;}
  .topstats .chip{display:none;}
  .topbar-in{padding:10px 14px;gap:12px;}
  .wordmark b{font-size:21px;} .wordmark small{display:none;}
  .logo{width:46px;height:46px;}
  .sidebar{position:fixed;top:67px;left:0;height:calc(100vh - 67px);background:var(--paper);z-index:15;box-shadow:var(--sh-hover);transform:translateX(-105%);transition:transform .2s;}
  .sidebar.open{transform:none;}
  .main{padding:20px 16px 50px;}
  .hello{grid-template-columns:1fr;}
  .hello-main h1{font-size:36px;}
  .hello-main{min-height:0;}
  .hello-deco{font-size:170px;}
  .banner h1{font-size:25px;} .banner .big{width:76px;height:76px;}
  .theory{padding:22px 18px;font-size:15.5px;}
  .theory table{display:block;overflow-x:auto;}
  .opts{grid-template-columns:1fr;}
  .tabs .prog{margin-left:0;width:100%;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">☰</button>
    <div class="logo" onclick="goHome()"><img src="logo.jpg" alt="Antónia Mancha — Professora"></div>
    <div class="wordmark" onclick="goHome()"><b><span>Gramática</span></b><small>Ensino secundário · 10.º, 11.º e 12.º anos</small></div>
    <div class="topstats" id="topstats"></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script src="dados.js"></script>
<script src="facil.js"></script>
<script src="mais.js"></script>
<script>
/* ===================== ICONS ===================== */
const I = {
  morf:`<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" stroke="currentColor" stroke-width="2.2"/><path d="M13.5 17.25h7.5M17.25 13.5V21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  sint:`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="4.5" r="2.5" stroke="currentColor" stroke-width="2.2"/><circle cx="5" cy="19" r="2.5" stroke="currentColor" stroke-width="2.2"/><circle cx="19" cy="19" r="2.5" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v4M12 11L5.8 16.6M12 11l6.2 5.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  texto:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9.5L5 20v-4H4z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 9h8M8 12.3h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6.5 10v9.5h11V10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  book:`<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 5.5c2.5-1.2 5.5-1.2 8.5 0v14c-3-1.2-6-1.2-8.5 0zM20.5 5.5c-2.5-1.2-5.5-1.2-8.5 0v14c3-1.2 6-1.2 8.5 0z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  quiz:`<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="17" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M9 4V3h6v1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 10.5l1.6 1.6 3-3M8.5 16h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  redo:`<svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v4.5h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 10l4 4M14 10l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  pen:`<svg viewBox="0 0 24 24" fill="none"><path d="M4 20l1.2-4.6L16 4.6l3.4 3.4L8.6 18.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.6 7l3.4 3.4" stroke="currentColor" stroke-width="2"/></svg>`
};

/* Each grammar domain gets one vivid colour; "on" is the text colour that reads on it */
const GROUPS = {
  "Morfologia":       {g:"var(--azul)",  bg:"var(--azul-bg)",  on:"#fff",          icon:I.morf,  short:"Palavras por dentro"},
  "Sintaxe":          {g:"var(--coral)", bg:"var(--coral-bg)", on:"#fff",          icon:I.sint,  short:"Quem faz o quê na frase"},
  "Texto e discurso": {g:"var(--sol)",   bg:"var(--sol-bg)",   on:"#fff",    icon:I.texto, short:"Para lá da frase"}
};
function gvars(m){ return `--g:${m.g};--g-bg:${m.bg};--g-on:${m.on};`; }

/* Typographic mark shown faintly behind each topic's boxes */
const MARK = {
  "classes-palavras":"Aa", "adjacencia-verbal":"lhe", "processos-fonologicos":"/a/",
  "formacao-palavras":"in", "funcoes-frase":"S+P", "funcoes-gv":"CD",
  "funcoes-nominal-adjetival":"N", "frase-complexa":"&", "atos-ilocutorios":"!",
  "modalidade-deixis":"eu", "coerencia-coesao":"¶", "valor-aspetual":"…"
};

/* ===================== HUMOUR ===================== */
const JOKES = [
  "O sujeito nulo expletivo é o único sujeito que nunca é culpado de nada. Choveu? Não foi ninguém.",
  "Uma vírgula entre o sujeito e o predicado é como sentar-se entre um casal no cinema: não se faz.",
  "A mesóclise existe para provar que o português gosta de complicar. Di-lo-ia eu, di-lo-ias tu.",
  "Anáfora: quando o texto se lembra do que disse. Catáfora: quando faz suspense.",
  "O complemento oblíquo não sai da frase. É o colega que nunca sai do grupo de WhatsApp.",
  "«Havia muitas pessoas» — o verbo haver, impessoal, recusa-se a ir para o plural. Questão de princípio.",
  "O modificador apositivo vem sempre entre vírgulas. É tímido, mas tem coisas interessantes a dizer.",
  "Valor aspetual habitual: estudar gramática todos os dias. Valor aspetual perfetivo: ter estudado."
];
const PRAISE = [
  "Até o Fernando Pessoa aplaudia — e eram vários.",
  "Isso é resposta de quem vai ao exame de cabeça erguida.",
  "Certíssimo. O examinador sorriu algures.",
  "Nem a próclise te engana.",
  "Impecável. Podes emoldurar.",
  "Boa! Assim até dá gosto corrigir."
];
const OOPS = [
  "Quase. A gramática prega partidas a todos.",
  "Não foi desta — mas lê a explicação e já não te apanham.",
  "Até o Camões reescrevia. Vê o critério.",
  "Essa engana meio país. Agora já sabes.",
  "Respira, relê a teoria e volta à carga."
];
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ===================== STATE ===================== */
let view = "home";          // "home" or a topic id
let tab = "simples";        // "simples" | "teoria" | "exercicios"
let lastKey = null;
let jokeIdx = Math.floor(Math.random()*JOKES.length);
let store = {};
try { store = JSON.parse(localStorage.getItem("gramatica_am_v2") || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("gramatica_am_v2", JSON.stringify(store)); } catch(e){} }
// store[topicId][idx] = {ok:true|false, choice:n | text:"..."}

function stats(t){
  const s = store[t.id] || {};
  const done = Object.keys(s).length;
  const ok = Object.values(s).filter(x=>x.ok).length;
  return {done, ok, total:t.exercicios.length, pct:Math.round(100*done/t.exercicios.length)};
}
function totals(){
  let done=0, ok=0, total=0;
  TOPICS.forEach(t=>{ const s=stats(t); done+=s.done; ok+=s.ok; total+=s.total; });
  return {done, ok, total, pct: total?Math.round(100*done/total):0};
}
function groups(){
  const g = {};
  TOPICS.forEach(t=>{ (g[t.grupo] = g[t.grupo] || []).push(t); });
  return g;
}
function bar(p){ return `<div class="bar"><i class="${p===0?'zero':''}" style="width:${p}%"></i></div>`; }

/* ===================== HEADER ===================== */
function renderTop(){
  const T = totals();
  const r = 18, c = 2*Math.PI*r, off = c*(1-T.pct/100);
  document.getElementById("topstats").innerHTML = `
    <span class="chip c1">${TOPICS.length} temas</span>
    <span class="chip c2">${T.total} exercícios</span>
    <span class="chip c3">${T.ok} ${T.ok===1?'certo':'certos'}</span>
    <svg class="ring" viewBox="0 0 46 46" aria-label="Progresso ${T.pct}%">
      <circle cx="23" cy="23" r="${r}" fill="#fff" stroke="#e8eae6" stroke-width="5"/>
      <circle cx="23" cy="23" r="${r}" fill="none" stroke="#1d6276" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 23 23)"/>
      <text x="23" y="27" text-anchor="middle" font-size="11" font-weight="800" font-family="Bricolage Grotesque, system-ui" fill="#1d6276">${T.pct}%</text>
    </svg>`;
}

/* ===================== SIDEBAR ===================== */
function renderSide(){
  const G = groups();
  const nw = wrongKeys().length;
  let h = `<div class="navhome ${view==='home'?'active':''}" onclick="goHome()">${I.home} Início</div>
    <div class="navtools">
      <div class="navtool ${view==='quiz'?'active':''}" onclick="startQuiz()">${I.quiz} Mini-teste</div>
      <div class="navtool ${view==='review'?'active':''}" onclick="startReview()">${I.redo} Os meus erros${nw?` <span class="badge">${nw}</span>`:''}</div>
    </div>`;
  for(const name in G){
    const m = GROUPS[name];
    h += `<div class="navgroup"><div class="navgroup-head" style="background:${m.g};color:#fff">${m.icon}${name}</div>`;
    G[name].forEach(t=>{
      const s = stats(t);
      h += `<div class="navitem ${view===t.id?'active':''} ${s.pct===100?'done':''}" onclick="openTopic('${t.id}')">
        <span class="dot" style="background:${m.g}"></span><span>${t.titulo}</span>
        <span class="pct">${s.pct===100?'✓':(s.pct?s.pct+'%':'')}</span></div>`;
    });
    h += `</div>`;
  }
  document.getElementById("sidebar").innerHTML = h;
}

/* ===================== HOME ===================== */
function renderHome(){
  const G = groups(), T = totals();
  const next = TOPICS.find(t=>stats(t).pct<100) || TOPICS[0];
  let h = `<section class="hello">
    <div class="hello-main">
      <div class="hello-deco">Aa</div>
      <span class="hello-eyebrow">Para o exame nacional de Português</span>
      <h1>A gramática <em>não morde.</em></h1>
      <p class="hello-sub">${T.done===0 ? "Antes de desistires, dá-lhe <b>cinco minutos</b>." : `Já fizeste <b>${T.done} de ${T.total}</b> exercícios. Continua!`}</p>
      <div class="hello-btns">
        <button class="btn btn-solid" onclick="openTopic('${next.id}')">${T.done===0?'Começar':'Continuar'}: ${next.titulo} →</button>
      </div>
    </div>
    <aside class="joke has-wm"><span class="wm">«»</span><span class="tag">Gramática com humor</span><p id="joke">${JOKES[jokeIdx]}</p><button onclick="nextJoke()">Outra ↻</button></aside>
  </section>
  <section class="acts">
    <div class="act has-wm" onclick="startQuiz()"><span class="wm">20</span><span class="act-ico">${I.quiz}</span><div><h3>Mini-teste</h3><p>10 perguntas ao calhas, de todos os temas. Nota de 0 a 20 no fim.</p></div><span class="act-go">Começar →</span></div>
    <div class="act has-wm" onclick="startReview()"><span class="wm">↻</span><span class="act-ico act-ico-2">${I.redo}</span><div><h3>Os meus erros</h3><p>${wrongKeys().length ? `Tens <b>${wrongKeys().length}</b> ${wrongKeys().length===1?'pergunta':'perguntas'} para tentar outra vez.` : 'Ainda não tens erros por rever. Boa!'}</p></div><span class="act-go">Rever →</span></div>
  </section>
  ${renderDaily()}`;
  for(const name in G){
    const m = GROUPS[name];
    h += `<div class="section-title"><div class="sicon" style="background:${m.g};color:#fff">${m.icon}</div><h2>${name}</h2><span class="n">· ${m.short}</span></div><div class="grid">`;
    G[name].forEach(t=>{
      const s = stats(t);
      h += `<div class="card has-wm" style="border-top:5px solid ${m.g};--g:${m.g}" onclick="openTopic('${t.id}')"><span class="wm">${MARK[t.id]||"Aa"}</span>
        <div class="card-top" style="color:${m.g}"><h3>${t.titulo}</h3></div>
        <div class="card-bot" style="--g:${m.g}">
          <div class="card-meta"><span>${s.total} exercícios</span>${s.pct===100?'<span class="trophy">🏆 dominado</span>':`<span>${s.pct}%</span>`}</div>
          ${bar(s.pct)}
        </div></div>`;
    });
    h += `</div>`;
  }
  h += `<footer>Conteúdos: «Resumo da Gramática — Ensino Secundário», Prof.ª Antónia Mancha. O teu progresso fica guardado neste dispositivo.</footer>`;
  return h;
}
function nextJoke(){ jokeIdx = (jokeIdx+1)%JOKES.length; document.getElementById("joke").textContent = JOKES[jokeIdx]; }

/* ===================== TOPIC ===================== */
function renderTopic(t){
  const m = GROUPS[t.grupo], s = stats(t);
  let h = `<div style="${gvars(m)}">
    <div class="banner" style="background:linear-gradient(135deg,${m.g},color-mix(in srgb,${m.g} 75%,#000));color:${m.on}">
      <div class="crumb"><a onclick="goHome()">Início</a> / ${t.grupo}</div>
      <h1>${t.titulo}</h1>
      <div class="big">${m.icon}</div>
    </div>
    <div class="tabs">
      ${FACIL[t.id]?`<button class="tabbtn ${tab==='simples'?'on':''}" onclick="setTab('simples')">💡 Em simples</button>`:''}
      <button class="tabbtn ${tab==='teoria'?'on':''}" onclick="setTab('teoria')">${I.book} Teoria</button>
      <button class="tabbtn ${tab==='exercicios'?'on':''}" onclick="setTab('exercicios')">${I.pen} Exercícios <span class="cnt">${s.total}</span></button>
      <div class="prog"><span>${s.done}/${s.total}</span>${bar(s.pct)}</div>
    </div>`;
  if(tab==="simples" && FACIL[t.id]){
    h += renderSimple(t);
  } else if(tab==="teoria"){
    h += `<article class="theory has-wm"><span class="wm">${MARK[t.id]||"§"}</span>${t.teoria}</article>
      <div class="tocta"><button class="btn" onclick="setTab('exercicios')">Já percebi — toca a praticar ${I.pen}</button></div>`;
  } else {
    if(s.done===s.total) h += `<div class="finish"><span>🏆</span>Tema concluído: ${s.ok} de ${s.total} certas. ${s.ok===s.total?'Perfeito!':'Revê as que falhaste e tenta de novo.'}</div>`;
    t.exercicios.forEach((ex,i)=>{ h += renderEx(t,ex,i,"t"); });
    h += `<div class="ex-foot"><span class="score">Certas: ${s.ok}/${s.total}</span>
      <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="setTab('teoria')">${I.book} Rever teoria</button><button class="btn" onclick="resetTopic('${t.id}')">↺ Recomeçar tema</button></span></div>`;
  }
  h += `<footer>Conteúdos: «Resumo da Gramática — Ensino Secundário», Prof.ª Antónia Mancha.</footer></div>`;
  return h;
}

/* Exercises can appear in 4 places ("contexts"):
   t = topic page · q = mini-teste · r = revisão de erros · d = pergunta do dia
   Every answer is saved to the student's progress (store); q/r/d also keep their own session copy. */
let session = {q:{}, r:{}, d:{}};
function ansFor(ctx, tid, i){ return ctx==="t" ? (store[tid]||{})[i] : session[ctx][tid+"_"+i]; }

function renderEx(t, ex, i, ctx="t", num=i+1){
  const a = ansFor(ctx, t.id, i);
  const id = `${ctx}_${t.id}_${i}`;
  const m = GROUPS[t.grupo];
  let body = "";
  if(ex.tipo==="mc"){
    body = `<div class="opts">` + ex.opcoes.map((o,k)=>{
      let cls = "";
      if(a){ if(k===ex.certa) cls="ok"; else if(k===a.choice) cls="bad"+(lastKey===id?" fresh":""); else cls="dim"; }
      return `<button class="opt ${cls}" ${a?'disabled':''} onclick="answerMC('${ctx}','${t.id}',${i},${k})"><span class="l">${"ABCD"[k]}</span>${o}</button>`;
    }).join("") + `</div>`;
  } else {
    body = `<div class="answer-row"><input id="in_${id}" placeholder="Escreve a tua resposta…" ${a?'disabled':''} value="${a?escapeAttr(a.text):''}" onkeydown="if(event.key==='Enter')answerShort('${ctx}','${t.id}',${i})">
      ${a?'':`<button class="btn" onclick="answerShort('${ctx}','${t.id}',${i})">Verificar</button>`}</div>`;
  }
  let fb = "";
  if(a){
    fb = `<div class="fb ${a.ok?'ok':'bad'} ${lastKey===id?'fresh':''}"><span class="v">${a.ok?'✓ '+a.msg:'✗ '+a.msg}</span><span class="c">${ex.criterio}</span></div>`;
  }
  const from = ctx==="t" ? "" : `<div class="ex-from"><span class="dot" style="background:${m.g}"></span>${t.grupo} · <a onclick="openTopic('${t.id}')">${t.titulo}</a></div>`;
  return `<div class="ex-card has-wm ${a?'done':''}" id="ex_${id}" style="${gvars(m)}"><span class="wm">${String(num).padStart(2,"0")}</span>${from}<div class="ex-q"><span class="num">${num}</span><div>${ex.enun}</div></div>${body}${fb}</div>`;
}
function escapeAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function record(ctx, tid, i, data){
  (store[tid] = store[tid] || {})[i] = data;
  save();
  if(ctx!=="t") session[ctx][tid+"_"+i] = data;
  if(ctx==="d"){ try{ localStorage.setItem("gramatica_am_dia", JSON.stringify({dia:today(), key:tid+"_"+i, data})); }catch(e){} }
  lastKey = `${ctx}_${tid}_${i}`;
  const keepY = window.scrollY;
  render();
  window.scrollTo(0, keepY);
}
function exOf(tid, i){ return TOPICS.find(t=>t.id===tid).exercicios[i]; }
function answerMC(ctx, tid, i, k){
  const ok = k===exOf(tid,i).certa;
  record(ctx, tid, i, {ok, choice:k, msg: ok?pick(PRAISE):pick(OOPS)});
}
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[.,;:!?«»"]/g,"").replace(/\s+/g," ").trim(); }
function answerShort(ctx, tid, i){
  const val = document.getElementById(`in_${ctx}_${tid}_${i}`).value;
  if(!val.trim()) return;
  const ok = exOf(tid,i).resposta.some(r=>norm(val).includes(norm(r)));
  record(ctx, tid, i, {ok, text:val, msg: ok?pick(PRAISE):"Compara com o critério — "+pick(OOPS).toLowerCase()});
}

/* ---------- all questions, as [topicId, index] ---------- */
function allKeys(){ const k=[]; TOPICS.forEach(t=>t.exercicios.forEach((_,i)=>k.push([t.id,i]))); return k; }
function wrongKeys(){ return allKeys().filter(([tid,i])=>{ const a=(store[tid]||{})[i]; return a && !a.ok; }); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Pergunta do dia ---------- */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dailyKey(){
  const keys = allKeys().filter(([tid,i])=>exOf(tid,i).tipo==="mc");
  const [y,mo,d] = today().split("-").map(Number);
  const day = Math.floor(Date.UTC(y,mo-1,d)/86400000);
  return keys[(day*7919) % keys.length];
}
try{ const s=JSON.parse(localStorage.getItem("gramatica_am_dia")||"null"); if(s && s.dia===today()) session.d[s.key]=s.data; }catch(e){}

function renderDaily(){
  const [tid,i] = dailyKey(); const t = TOPICS.find(x=>x.id===tid);
  let d = new Date().toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"}); d = d.charAt(0).toUpperCase()+d.slice(1);
  return `<section class="daily"><div class="daily-h"><span class="daily-tag">📅 Pergunta do dia</span><span class="daily-date">${d}</span></div>
    ${renderEx(t, t.exercicios[i], i, "d", 1)}
    <p class="daily-note">Amanhã há outra. Volta cá!</p></section>`;
}

/* ---------- Mini-teste ---------- */
let quizKeys = [];
function startQuiz(){
  quizKeys = shuffle(allKeys().filter(([tid,i])=>exOf(tid,i).tipo==="mc")).slice(0,10);
  session.q = {}; lastKey=null; view="quiz"; closeMenu(); render(); window.scrollTo(0,0);
}
function renderQuiz(){
  if(!quizKeys.length){ quizKeys = shuffle(allKeys().filter(([tid,i])=>exOf(tid,i).tipo==="mc")).slice(0,10); session.q = {}; }
  const done = quizKeys.filter(([tid,i])=>session.q[tid+"_"+i]).length;
  const ok = quizKeys.filter(([tid,i])=>(session.q[tid+"_"+i]||{}).ok).length;
  let h = `<div class="banner banner-neutral"><div class="crumb"><a onclick="goHome()">Início</a> / Treino</div><h1 class="ttl-ico">${I.quiz} Mini-teste</h1><p class="banner-p">10 perguntas ao calhas, de todos os temas. No fim, tens a tua nota de 0 a 20.</p></div>
    <div class="tabs"><div class="prog" style="margin-left:0;width:100%"><span>${done}/10</span>${bar(done*10)}</div></div>`;
  if(done===10) h += quizResult(ok);
  quizKeys.forEach(([tid,i],n)=>{ const t=TOPICS.find(x=>x.id===tid); h += renderEx(t, t.exercicios[i], i, "q", n+1); });
  if(done===10) h += `<div class="ex-foot"><span></span><span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="startQuiz()">${I.quiz} Novo mini-teste</button><button class="btn" onclick="startReview()">${I.redo} Rever os meus erros</button></span></div>`;
  return h + `<footer>As respostas contam para o teu progresso em cada tema.</footer>`;
}
function quizResult(ok){
  const nota = ok*2;
  const msg = nota>=18 ? "Excelente! Podes ir ao exame de cabeça erguida."
            : nota>=14 ? "Muito bem! Mais umas revisões e ficas imbatível."
            : nota>=10 ? "Positiva! Mas dá para mais — revê os erros."
            : "Ainda não chegaste lá. Revê os erros e tenta outra vez — vais ver que sobe.";
  return `<div class="result"><div class="nota"><b>${nota}</b><span>/20</span></div><div><div class="result-t">${ok} certas em 10</div><p>${msg}</p></div></div>`;
}

/* ---------- Os meus erros ---------- */
let reviewKeys = [];
function startReview(){ reviewKeys = wrongKeys(); session.r = {}; lastKey=null; view="review"; closeMenu(); render(); window.scrollTo(0,0); }
function renderReview(){
  let h = `<div class="banner banner-neutral"><div class="crumb"><a onclick="goHome()">Início</a> / Treino</div><h1 class="ttl-ico">${I.redo} Os meus erros</h1><p class="banner-p">As perguntas em que falhaste, para tentares outra vez. Quando acertares, saem da lista.</p></div>`;
  if(!reviewKeys.length){
    return h + `<div class="empty"><span>🎉</span><div><b>Não tens erros por rever.</b><p>Ou ainda não respondeste a nada, ou estás a ir muito bem! Experimenta um mini-teste.</p><button class="btn" onclick="startQuiz()">${I.quiz} Fazer um mini-teste</button></div></div>`;
  }
  const fixed = reviewKeys.filter(([tid,i])=>(session.r[tid+"_"+i]||{}).ok).length;
  h += `<div class="tabs"><div class="prog" style="margin-left:0;width:100%"><span>${fixed}/${reviewKeys.length} corrigidas</span>${bar(Math.round(100*fixed/reviewKeys.length))}</div></div>`;
  reviewKeys.forEach(([tid,i],n)=>{ const t=TOPICS.find(x=>x.id===tid); h += renderEx(t, t.exercicios[i], i, "r", n+1); });
  h += `<div class="ex-foot"><span></span><button class="btn" onclick="startReview()">↻ Atualizar a lista</button></div>`;
  return h;
}

function resetTopic(tid){ delete store[tid]; save(); render(); window.scrollTo(0,0); }

function renderSimple(t){
  const f = FACIL[t.id];
  let h = `<section class="eli5 has-wm"><span class="wm">?</span><span class="eli5-tag">💡 Explicado de forma simples</span><p>${f.ideia}</p></section>
    <h2 class="tricks-title">🔎 Truques para descobrir logo</h2><div class="tricks">`;
  f.truques.forEach(([emo,tit,como,ex])=>{
    h += `<div class="trick"><div class="trick-h"><span class="emo">${emo}</span>${tit}</div><p>${como}</p>${ex?`<div class="trick-ex">${ex}</div>`:''}</div>`;
  });
  h += `</div><div class="tocta" style="gap:10px;flex-wrap:wrap"><button class="btn" onclick="setTab('teoria')">${I.book} Ver a teoria completa</button><button class="btn" style="background:var(--g);color:#fff" onclick="setTab('exercicios')">${I.pen} Testar já</button></div>`;
  return h;
}

/* ===================== NAV ===================== */
function render(){
  renderTop(); renderSide();
  const main = document.getElementById("main");
  main.innerHTML = view==="home" ? renderHome()
    : view==="quiz" ? renderQuiz()
    : view==="review" ? renderReview()
    : renderTopic(TOPICS.find(t=>t.id===view));
}
function goHome(){ lastKey=null; view="home"; closeMenu(); render(); window.scrollTo(0,0); location.hash=""; }
function openTopic(id){ lastKey=null; view=id; tab=FACIL[id]?"simples":"teoria"; closeMenu(); render(); window.scrollTo(0,0); location.hash=id; }
function setTab(x){ lastKey=null; tab=x; render(); window.scrollTo(0,0); }
function toggleMenu(){ document.getElementById("sidebar").classList.toggle("open"); }
function closeMenu(){ document.getElementById("sidebar").classList.remove("open"); }

const fromHash = location.hash.slice(1);
if(fromHash && TOPICS.some(t=>t.id===fromHash)) view = fromHash;
if(fromHash==='mini-teste'){ quizKeys = shuffle(allKeys().filter(([tid,i])=>exOf(tid,i).tipo==='mc')).slice(0,10); view='quiz'; }
if(fromHash==='erros'){ reviewKeys = wrongKeys(); view='review'; }
render();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
